<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>e2 土台テスト</title>
<style>
  body { margin:0; padding:10px; background:#1b1d21; color:#e8e8e8; font-family:-apple-system, "Hiragino Sans", sans-serif; font-size:15px; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; background:#262a30; border-radius:10px; padding:8px 10px; margin-bottom:10px; }
  .bar > * { margin-right:14px; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:6px; background:#777; margin-right:6px; vertical-align:middle; }
  .dot.ok { background:#4cd964; } .dot.busy { background:#ffcc00; } .dot.ng { background:#ff3b30; }
  .big { font-size:18px; } .big b { color:#ffd479; }
  .box { background:#262a30; border-radius:10px; padding:10px; margin-bottom:10px; }
  h2 { font-size:16px; margin:0 0 8px; color:#9fd0ff; }
  button { font-size:16px; padding:9px 12px; border-radius:8px; border:1px solid #555; background:#33383f; color:#fff; margin:2px 6px 2px 0; }
  button.main { background:#2d6cdf; border-color:#2d6cdf; }
  .scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { border-collapse:collapse; width:100%; font-size:13px; text-align:center; white-space:nowrap; }
  th { color:#9fd0ff; font-weight:normal; padding:4px 3px; border-bottom:1px solid #555; }
  td { padding:3px; border-bottom:1px solid #3a3f46; }
  td.p { color:#ffd479; font-weight:bold; font-size:15px; }
  tr.muted td { color:#6c7076; }
  .tg { min-width:54px; padding:8px 4px; margin:0; font-size:14px; }
  .tg.on { background:#e0663a; border-color:#e0663a; font-weight:bold; }
  .flash { background:#3d4f2a; }
  .dim { color:#999; font-size:13px; }
  pre { background:#111316; border-radius:8px; padding:8px; font-family:Menlo, monospace; font-size:12px; white-space:pre-wrap; word-break:break-all; margin:6px 0 0; max-height:180px; overflow-y:auto; }
  .ok { color:#6be38a; } .ng { color:#ff7a7a; }
  label { display:inline-block; padding:4px 0; margin-right:12px; }
  input[type=checkbox] { transform:scale(1.3); margin-right:6px; }
  textarea { width:100%; height:120px; box-sizing:border-box; background:#111316; color:#e8e8e8; border-radius:8px; border:1px solid #444; font-family:Menlo, monospace; font-size:11px; }
</style>
</head>
<body>

<div class="bar">
  <span><span class="dot" id="dot"></span><span id="conn">起動中</span></span>
  <span class="big">パターン <b id="gName">-</b></span>
  <span class="big">BPM <b id="gTempo">-</b></span>
  <span class="big">MFX <b id="gMfx">-</b></span>
  <span class="dim" id="gLoaded">-</span>
  <button class="main" id="btnReload">読み直す</button>
  <span class="dim" id="ver">-</span>
</div>

<div class="box">
  <h2>16パートの状態（本体のつまみを回すと即座に変わります）</h2>
  <div class="row">
    <button id="mfxAllOn">MFX Send 全オン</button>
    <button id="mfxAllOff">MFX Send 全オフ</button>
    <span class="dim">表の MFX / IFX ボタンを押すと e2 に送信します</span>
  </div>
  <div class="scroll"><table id="tbl"></table></div>
  <div class="dim">灰色の行はミュート中のパートです。変わったセルは一瞬緑になります。</div>
</div>

<div class="box">
  <h2>照合（予測した値と、読み直した実際の値の比較）</h2>
  <label><input type="checkbox" id="optVerify" checked>操作が止まって 1.5 秒後に読み直して照合する</label>
  <label><input type="checkbox" id="optAuto" checked>パターン切替で読み直す</label>
  <pre id="verifyLog">まだ照合していません</pre>
</div>

<div class="box">
  <h2>MIDI の記録</h2>
  <div class="dim" id="ports">-</div>
  <pre id="midiLog"></pre>
</div>

<div class="box">
  <h2>結果まとめ（Claude に貼り付ける用）</h2>
  <button id="btnSummary">まとめを作る</button><button id="btnSelect">全選択</button>
  <textarea id="summary" readonly></textarea>
</div>

<script src="e2core.js?v=3"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  if (!window.E2) { $("conn").textContent = "e2core.js を読み込めません（同じ場所にアップロードされているか確認してください）"; $("dot").className = "dot ng"; return; }

  // 表に出す列：[見出し, 項目名, 表示方法]
  var COLS = [
    ["MFX", "mfxSend", "toggle"], ["IFX", "ifxOn", "toggle"],
    ["Lvl", "level"], ["Pan", "pan"], ["Cut", "cutoff"], ["Res", "reso"], ["EGi", "filterEG"],
    ["Atk", "attack"], ["Dcy", "decay"], ["Ptch", "pitch"], ["Gld", "glide"], ["OscE", "oscEdit"],
    ["ModD", "modDepth"], ["ModS", "modSpeed"], ["IFXE", "ifxEdit"], ["Filter", "filterTypeName"]
  ];
  var midiLines = [], verifyLines = [];

  // ---- 表を作る（最初の1回） ----
  function buildTable() {
    var h = "<tr><th>Part</th><th>Mute</th>";
    for (var c = 0; c < COLS.length; c++) h += "<th>" + COLS[c][0] + "</th>";
    h += "</tr>";
    for (var p = 1; p <= 16; p++) {
      h += '<tr id="row' + p + '"><td class="p">' + p + '</td><td id="c' + p + '_mute">-</td>';
      for (var k = 0; k < COLS.length; k++) {
        var id = "c" + p + "_" + COLS[k][1];
        if (COLS[k][2] === "toggle") h += '<td><button class="tg" id="' + id + '" data-p="' + p + '" data-f="' + COLS[k][1] + '">-</button></td>';
        else h += '<td id="' + id + '">-</td>';
      }
      h += "</tr>";
    }
    $("tbl").innerHTML = h;
    var btns = document.querySelectorAll(".tg");
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = function () {
        if (!E2.state.loaded) return;
        var p = parseInt(this.getAttribute("data-p"), 10), f = this.getAttribute("data-f");
        E2.setPart(p, f, E2.state.parts[p][f] ? 0 : 1);
      };
    }
  }

  // ---- 1セル更新 ----
  function setCell(p, f, flash) {
    var el = $("c" + p + "_" + f);
    if (!el) return;
    var v = E2.state.parts[p][f];
    if (el.className.indexOf("tg") >= 0) {
      el.textContent = v ? "ON" : "off";
      el.className = "tg" + (v ? " on" : "");
    } else {
      el.textContent = (f === "mute") ? (v ? "Mute" : "-") : v;
    }
    if (flash) {
      var td = el.tagName === "TD" ? el : el.parentNode;
      td.className = "flash";
      setTimeout(function () { td.className = ""; }, 400);
    }
  }
  function renderAll() {
    var s = E2.state, g = s.global;
    $("gName").textContent = g.name;
    $("gTempo").textContent = g.tempo.toFixed(1);
    $("gMfx").textContent = g.mfxTypeName + (g.mfxHold ? "（Hold）" : "");
    $("gLoaded").textContent = "読込 " + s.loadedAt.toLocaleTimeString() + "（" + s.reason + "、" + s.loadMs + "ms）";
    for (var p = 1; p <= 16; p++) {
      $("row" + p).className = s.parts[p].mute ? "muted" : "";
      setCell(p, "mute");
      for (var c = 0; c < COLS.length; c++) setCell(p, COLS[c][1]);
    }
  }

  // ---- 通知を受け取る ----
  E2.on(function (type, d) {
    if (type === "status") {
      var st = E2.status;
      var dot = $("dot");
      if (st.midi === "unsupported") { dot.className = "dot ng"; $("conn").textContent = "Web MIDI 非対応"; }
      else if (st.midi === "denied") { dot.className = "dot ng"; $("conn").textContent = "MIDI 使用不可（SysEx 設定を確認）"; }
      else if (!st.outName) { dot.className = "dot ng"; $("conn").textContent = "e2 が見つかりません"; }
      else if (st.pendingPattern !== null && st.pendingPattern !== undefined) { dot.className = "dot busy"; $("conn").textContent = "パターン " + (st.pendingPattern + 1) + " へ切替待ち"; }
      else if (st.busy) { dot.className = "dot busy"; $("conn").textContent = "読み込み中"; }
      else { dot.className = "dot ok"; $("conn").textContent = "接続中"; }
      $("ports").textContent = "入力：" + st.inNames.join(" / ") + "　出力：" + st.outName;
    } else if (type === "loaded") {
      renderAll();
    } else if (type === "part") {
      setCell(d.part, d.field, true);
    } else if (type === "verify") {
      var t = new Date().toLocaleTimeString();
      if (!d.mismatches.length) {
        verifyLines.unshift(t + "  " + d.checked + " 項目すべて一致");
      } else {
        for (var i = 0; i < d.mismatches.length; i++) {
          var m = d.mismatches[i];
          verifyLines.unshift(t + "  ✗ パート" + m.part + " " + m.field + "：予測 " + m.expected + " / 実際 " + m.actual + "（CC " + m.cc + "、" + (m.source === "e2" ? "本体の操作" : "画面の操作") + "）" + (m.history ? "\n      直前の CC: " + m.history : ""));
        }
      }
      if (verifyLines.length > 40) verifyLines.length = 40;
      $("verifyLog").textContent = verifyLines.join("\n");
    } else if (type === "midi") {
      midiLines.unshift(d);
      if (midiLines.length > 100) midiLines.length = 100;
      $("midiLog").textContent = midiLines.join("\n");
    } else if (type === "error") {
      midiLines.unshift("⚠ " + d);
      $("midiLog").textContent = midiLines.join("\n");
    }
  });

  // ---- ボタン ----
  $("btnReload").onclick = function () { E2.requestDump("手動"); };
  $("mfxAllOn").onclick = function () { if (E2.state.loaded) E2.setAllParts("mfxSend", 1); };
  $("mfxAllOff").onclick = function () { if (E2.state.loaded) E2.setAllParts("mfxSend", 0); };
  $("optVerify").onchange = function () { E2.options.verifyAfterEdit = this.checked; };
  $("optAuto").onchange = function () { E2.options.autoReloadOnPattern = this.checked; };
  $("btnSummary").onclick = function () {
    var s = [], st = E2.state;
    s.push("[e2 土台テスト / 画面 base-v3 / " + E2.version + "]");
    s.push("接続: " + $("conn").textContent + " / " + $("ports").textContent);
    if (st.loaded) s.push("全体: " + st.global.name + " BPM " + st.global.tempo + " MFX " + st.global.mfxTypeName + " / " + $("gLoaded").textContent);
    s.push("--- 照合 ---");
    s.push(verifyLines.slice(0, 30).join("\n") || "なし");
    s.push("--- MIDI ---");
    s.push(midiLines.slice(0, 40).join("\n"));
    $("summary").value = s.join("\n");
  };
  $("btnSelect").onclick = function () { var ta = $("summary"); ta.focus(); ta.setSelectionRange(0, ta.value.length); };

  $("ver").textContent = "画面 base-v3 / " + E2.version;
  buildTable();
  E2.start();
})();
</script>
</body>
</html>
